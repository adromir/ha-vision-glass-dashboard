name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release'
        required: false

jobs:
  release:
    name: Validate & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Integration & Run Tests
        run: |
          if [ ! -f "custom_components/vision_glass/manifest.json" ]; then
            echo "Error: custom_components/vision_glass/manifest.json not found!"
            exit 1
          fi
          python -m compileall -q custom_components/vision_glass
          python -m unittest -v tests/test_python_backend.py
          node tests/test_frontend_modules.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
